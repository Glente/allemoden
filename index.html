<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alle mod en · Høstfest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: TV-studie i én skærm. Pointtavle med to blodposer øverst, scene med skala i midten, værtens knapper nederst. På mobil (#stem): én stor stemmeknap-flade. */
:root{
  --bg:#150a0c; --stage:#22110f; --panel:#2d1714; --line:#4a2620;
  --blood:#c8172c; --blood-deep:#7d0d1b; --plasma:#f1b43c; --plasma-soft:#f7d58c;
  --fg:#f7ede4; --muted:#bda29a; --ok:#7fb24a; --bad:#e2533f;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 50% 0%,#3a1612 0%,var(--bg) 60%) fixed,var(--bg);color:var(--fg);font-family:var(--body);font-size:clamp(15px,1.2vw,22px);overflow-x:hidden}
#app{min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;gap:12px;box-sizing:border-box;max-width:1800px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer;border-radius:10px;padding:.7em 1.2em;font-weight:800;background:var(--panel);color:var(--fg);border:1px solid var(--line)}
button:hover{border-color:var(--plasma)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:3px solid var(--plasma);outline-offset:2px}
button.primary{background:var(--blood);border-color:var(--blood);color:#fff}
button.primary:hover{background:#e01d34}
button.gold{background:var(--plasma);border-color:var(--plasma);color:#2a1408}
button.ghost{background:transparent}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;background:var(--stage);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:.55em .7em}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--muted);font-size:.85em;letter-spacing:.04em;text-transform:uppercase}
.kbd{font-size:.75em;color:var(--muted);font-weight:400}

/* Pointtavle */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.side{display:flex;align-items:center;gap:14px;min-width:0}
.side.right{justify-content:flex-end;text-align:right}
.side .who{min-width:0}
.side .tag{font-size:.75em;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.side .name{font-family:var(--display);font-size:clamp(24px,3vw,56px);line-height:1;overflow-wrap:anywhere;outline:none}
.side .name[contenteditable]:focus{color:var(--plasma)}
.side .pts{font-family:var(--display);font-size:clamp(36px,5vw,96px);line-height:1;font-variant-numeric:tabular-nums;color:var(--plasma)}
.bag{width:clamp(44px,5vw,92px);flex:none}
.mid{text-align:center}
.mid .vs{font-family:var(--display);font-size:clamp(20px,2.2vw,40px);color:var(--blood)}
.mid .rnd{font-size:.8em;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:800}

/* Scene */
.stage{flex:1;background:linear-gradient(180deg,var(--stage),#1a0d0b);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,56px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(14px,2vw,32px);align-content:start;position:relative;overflow:hidden}
.stage .main{display:flex;flex-direction:column;gap:clamp(14px,2vw,30px);min-width:0}
.eyebrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{font-weight:800;font-size:.8em;letter-spacing:.14em;text-transform:uppercase;padding:.35em .8em;border-radius:99px;background:var(--blood-deep);color:var(--plasma-soft)}
.chip.alt{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chip.live{background:var(--ok);color:#10200a}
.q{font-family:var(--display);font-size:clamp(30px,3.6vw,76px);line-height:1.05;max-width:26ch}
.desc{font-size:clamp(17px,1.6vw,30px);color:var(--muted);max-width:50ch;line-height:1.35;margin:0}

/* Skalaen */
.scale{position:relative;padding:clamp(50px,5vw,90px) 0 clamp(40px,4vw,64px)}
.track{position:relative;height:clamp(16px,1.6vw,28px);border-radius:99px;background:linear-gradient(90deg,#3b1d18,var(--blood-deep) 50%,var(--blood));border:1px solid var(--line)}
.ticks{display:flex;justify-content:space-between;margin-top:10px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.ends{display:flex;justify-content:space-between;gap:20px;margin-top:6px;font-size:.9em;color:var(--fg)}
.ends span:last-child{text-align:right}
.band{position:absolute;top:-8px;bottom:-8px;border-radius:8px;background:rgba(127,178,74,.28);border:2px dashed var(--ok)}
.pin{position:absolute;bottom:calc(100% + 6px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;transition:left .9s cubic-bezier(.2,.8,.2,1)}
.pin .val{font-family:var(--display);font-size:clamp(24px,2.8vw,54px);line-height:1;font-variant-numeric:tabular-nums}
.pin .who{font-size:.7em;letter-spacing:.12em;text-transform:uppercase;font-weight:800;white-space:nowrap}
.pin::after{content:"";width:4px;height:clamp(22px,2.4vw,40px);border-radius:2px;background:currentColor}
.pin.one{color:var(--plasma);z-index:2}
.pin.avg .val,.pin.avg .who{background:var(--stage);padding:0 .25em;border-radius:6px}
.pin.avg{color:#ff7d8b;bottom:auto;top:calc(100% + 6px);flex-direction:column-reverse}
.hist{display:flex;align-items:flex-end;gap:4px;height:clamp(50px,6vw,110px);margin-bottom:10px}
.hist i{flex:1;background:var(--blood);opacity:.75;border-radius:4px 4px 0 0;min-height:2px;transition:height .6s}
.verdict{font-family:var(--display);font-size:clamp(28px,3.4vw,70px);line-height:1}
.verdict.one{color:var(--plasma)} .verdict.all{color:#ff7d8b}

/* Sidepanel med stemmer og QR */
.side-panel{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;width:clamp(170px,16vw,300px)}
.count{font-family:var(--display);font-size:clamp(44px,5vw,100px);line-height:1;color:var(--plasma);font-variant-numeric:tabular-nums}
.qr{background:#fff;padding:10px;border-radius:12px;width:100%;box-sizing:border-box;max-width:100%}
.qr img,.qr canvas{width:100%!important;height:auto!important;display:block}
.small{font-size:.8em;color:var(--muted);line-height:1.4;overflow-wrap:anywhere}

.stepper{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stepper button{padding:.35em .9em}
.stepper input{width:6ch;text-align:center;font-weight:800}
.inputs{display:flex;flex-wrap:wrap;gap:clamp(14px,2vw,40px);align-items:flex-end}

/* Værtens knapper */
.host{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.host .grp{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Start og slut */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(20px,4vw,70px);align-items:center;flex:1}
.title{font-size:clamp(64px,11vw,230px);line-height:.88;text-transform:uppercase}
.title em{font-style:normal;color:var(--blood)}
.title .one{color:var(--plasma);display:inline-block;transform:rotate(-4deg)}
.sub{font-size:clamp(16px,1.6vw,30px);color:var(--muted);margin-top:.6em;max-width:36ch;line-height:1.35}
.setup{background:var(--stage);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,2.4vw,40px);display:flex;flex-direction:column;gap:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rules{font-size:.9em;color:var(--muted);line-height:1.5;margin:0;padding-left:1.1em}
.rules li+li{margin-top:.3em}
textarea{width:100%;box-sizing:border-box;min-height:50vh;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.5}
.help{font-size:.85em;color:var(--muted);line-height:1.5}
.help code{color:var(--plasma-soft)}
.err{color:var(--bad);font-weight:600}
.big-win{font-size:clamp(50px,9vw,190px);line-height:.95;text-transform:uppercase}
.recap{display:flex;flex-wrap:wrap;gap:8px}
.recap span{padding:.35em .7em;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:.85em}
.recap span.one{border-color:var(--plasma);color:var(--plasma)}
.recap span.all{border-color:var(--blood);color:#ff8a96}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:5}

/* Mobil-stemmeside */
.vote{flex:1;display:flex;flex-direction:column;gap:20px;max-width:560px;width:100%;margin:0 auto;font-size:17px}
.vote .brand{font-family:var(--display);font-size:28px;text-transform:uppercase}
.vote .brand em{font-style:normal;color:var(--blood)}
.vote .q{font-size:clamp(28px,7vw,40px)}
.vgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.vgrid button{font-family:var(--display);font-weight:400;font-size:30px;padding:.5em 0}
.vgrid button.on{background:var(--plasma);color:#2a1408;border-color:var(--plasma)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn button{font-family:var(--display);font-weight:400;font-size:40px;padding:.6em 0}
.yn button.on{background:var(--plasma);color:#2a1408;border-color:var(--plasma)}
.vote .ends{font-size:14px;color:var(--muted)}
.wait{background:var(--stage);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted);line-height:1.5}
.wait b{display:block;font-family:var(--display);font-weight:400;font-size:30px;color:var(--fg);margin-bottom:6px}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .stage{grid-template-columns:1fr}
  .side-panel{width:auto}
  .board{grid-template-columns:1fr 1fr}
  .mid{grid-column:1/-1;order:-1}
  .bag{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="app"></div>
<canvas id="fx"></canvas>

<script>
/* ===== INDSÆT DIN FIREBASE-KONFIGURATION HER (se guiden, trin 2) ===== */
window.FIREBASE_CONFIG = {
  apiKey: "AIzaSyCEAgnvH9QDeYBCJkfw7vtMnbBKOKrYC9I",
  authDomain: "allemoden.firebaseapp.com",
  projectId: "allemoden",
  storageBucket: "allemoden.firebasestorage.app",
  messagingSenderId: "160228010466",
  appId: "1:160228010466:web:815c73a8161fc762eff1bb"
};
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const CONFIG = window.FIREBASE_CONFIG || {};
const PARAMS = new URLSearchParams(location.search);
const IS_PHONE = PARAMS.has("stem");
const PHONE_GAME = PARAMS.get("stem");
const FB_READY = !!(window.firebase && CONFIG.apiKey && !String(CONFIG.apiKey).startsWith("INDSÆT"));
let fs=null, auth=null;
function voteUrl(){ return location.origin+location.pathname+"?stem="+(NET.gameId||""); }
async function fbInit(){
  firebase.initializeApp(CONFIG);
  auth=firebase.auth(); fs=firebase.firestore();
  if(window.FB_EMULATOR){ auth.useEmulator("http://127.0.0.1:9099"); fs.useEmulator("127.0.0.1",8080); }
  const restored=await new Promise(res=>{ const u=auth.onAuthStateChanged(x=>{ u(); res(x) }) });
  const user=restored || (await auth.signInAnonymously()).user;
  return user.uid;
}

const DEFAULT_BANK = `# Én runde pr. linje. Felter adskilles med |
# SKALA | spørgsmål | laveste tal | højeste tal | tekst ved laveste | tekst ved højeste
# JANEJ | spørgsmål      (salen svarer ja eller nej, den ene gætter hvor mange procent der siger ja)

SKALA | Hvor god er kaffen på afdelingen? | 1 | 10 | Kold opvask | Barista-niveau
JANEJ | Kan du huske din egen blodtype uden at slå den op?
SKALA | Hvor stresset er du en travl mandag morgen på afsnittet? | 1 | 10 | Helt zen | Brandalarm
SKALA | Hvor godt kan du lide græskarsuppe? | 1 | 10 | Nej tak | Tre portioner
JANEJ | Har du nogensinde sagt "det er bare et lille prik" og vidst, at det ikke var sandt?
SKALA | Hvor mange timer sov du i nat? | 0 | 12 | 0 timer | 12 timer
SKALA | Hvor stor en fan er du af Sundhedsplatformen? | 1 | 10 | Jeg græder | Jeg elsker den
JANEJ | Har du kage i tasken eller på skrivebordet lige nu?
SKALA | Hvor godt kender du navnene på alle i salen? | 1 | 10 | Næsten ingen | Hver eneste
JANEJ | Har du drukket kaffe, der var lavet før din vagt startede?
SKALA | Hvor meget glæder du dig til julefrokosten? | 1 | 10 | Slet ikke | Har allerede købt kjole
SKALA | Hvor sandsynligt er det, at du danser i aften? | 1 | 10 | Aldrig | Er allerede i gang
JANEJ | Har du nogensinde forklaret leukocytter med en madmetafor?
`;

const STORE_KEY = "allemoden.bank.v2";
function loadBank(){ try{ return localStorage.getItem(STORE_KEY) || DEFAULT_BANK }catch(e){ return DEFAULT_BANK } }
function saveBank(t){ try{ localStorage.setItem(STORE_KEY,t) }catch(e){} }

function parseBank(text){
  const items=[], errors=[];
  text.split(/\r?\n/).forEach((raw,i)=>{
    const line=raw.trim(); if(!line||line.startsWith("#")) return;
    const f=line.split("|").map(s=>s.trim()); const kind=(f[0]||"").toUpperCase();
    if(kind==="SKALA"){
      const lo=Number(f[2]), hi=Number(f[3]);
      if(!f[1]||!Number.isInteger(lo)||!Number.isInteger(hi)||hi<=lo||hi-lo>20) errors.push(`Linje ${i+1}: SKALA kræver et spørgsmål og to hele tal, fx 1 og 10 (højst 20 trin).`);
      else items.push({type:"skala",q:f[1],min:lo,max:hi,lo:f[4]||String(lo),hi:f[5]||String(hi)});
    } else if(kind==="JANEJ"){
      if(!f[1]) errors.push(`Linje ${i+1}: JANEJ kræver et spørgsmål.`);
      else items.push({type:"janej",q:f[1],min:0,max:100,lo:"Ingen siger ja",hi:"Alle siger ja"});
    } else errors.push(`Linje ${i+1}: starter ikke med SKALA eller JANEJ.`);
  });
  return {items,errors};
}

const S = {
  phase:"start", name:"Den ene", room:40, nRounds:7, shuffle:false, margin:10, extUrl:"",
  rounds:[], idx:0, score:{one:0,all:0}, results:[],
  step:"ready", roundId:null, guess:null, manualAvg:null, final:null
};
const NET = {db:null, user:null, canWrite:false, votes:[], unsub:null, status:"Forbinder..."};

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dk = (n,d=1)=>Number(n).toLocaleString("da-DK",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtVal=(r,v)=>r.type==="janej"?`${Math.round(v)} %`:dk(v,1);
const tolOf=r=>(r.max-r.min)*S.margin/100;
const EXT=()=>!!S.extUrl;
const canOpen=()=>EXT()||NET.canWrite;
const qrUrl=()=>S.extUrl?(/^https?:/i.test(S.extUrl)?S.extUrl:"https://"+S.extUrl):voteUrl();

/* ---------- Data: afstemning via Firebase ---------- */
function currentVotes(){ if(EXT()) return []; return NET.votes.filter(v=>v.roundId===S.roundId && typeof v.value==="number") }
function liveAvg(r){
  const vs=currentVotes(); if(!vs.length) return null;
  return vs.reduce((a,v)=>a+v.value,0)/vs.length;
}
async function writeGame(data){
  if(EXT()||!NET.ref||!NET.canWrite) return;
  try{ await NET.ref.set(Object.assign({},data,{hostUid:NET.uid})) }
  catch(e){ NET.status="Kunne ikke opdatere afstemningen ("+(e.code||e.message)+")."; flash(NET.status) }
}
async function initHostNet(){
  if(!FB_READY){
    NET.status = window.firebase ? "Firebase er ikke sat op endnu, så salen kan ikke stemme på mobilen. Se guiden, eller indsæt et Mentimeter-link nedenfor." : "Kunne ikke hente Firebase. Tjek internetforbindelsen.";
    render(); return }
  try{
    const uid=await fbInit(); NET.uid=uid;
    let saved=null; try{ saved=JSON.parse(localStorage.getItem("allemoden.game")||"null") }catch(e){}
    if(!saved||saved.uid!==uid){ saved={uid,gameId:Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3)}; try{ localStorage.setItem("allemoden.game",JSON.stringify(saved)) }catch(e){} }
    NET.gameId=saved.gameId;
    NET.ref=fs.collection("games").doc(NET.gameId);
    const snap=await NET.ref.get();
    if(!snap.exists) await NET.ref.set({hostUid:uid,open:false,roundId:null,q:"",waiting:"Spillet starter om lidt"});
    NET.canWrite=true; NET.status="Forbundet. Salen kan scanne QR-koden og stemme uden login.";
    NET.ref.collection("votes").onSnapshot(sn=>{ NET.votes=sn.docs.map(d=>d.data()); updateLive() },
      ()=>{ NET.status="Forbindelsen til stemmerne blev afbrudt. Genindlæs siden."; render() });
    render();
  }catch(e){ console.error(e); NET.canWrite=false; NET.status="Kunne ikke forbinde til Firebase ("+(e.code||e.message)+"). Se guiden."; render() }
}

/* ---------- Blodpose som pointmåler ---------- */
function bag(fill,id){
  const top=34,h=150, level=top+(h-top)*(1-Math.max(0,Math.min(1,fill)));
  return `<svg class="bag" viewBox="0 0 80 190" aria-hidden="true">
    <defs><clipPath id="c${id}"><path d="M10 34 Q10 26 18 26 H62 Q70 26 70 34 V140 Q70 150 60 150 H20 Q10 150 10 140 Z"/></clipPath></defs>
    <rect x="30" y="4" width="20" height="16" rx="4" fill="#3d201b"/>
    <rect x="37" y="150" width="6" height="36" fill="#3d201b"/>
    <path d="M10 34 Q10 26 18 26 H62 Q70 26 70 34 V140 Q70 150 60 150 H20 Q10 150 10 140 Z" fill="#2a1512" stroke="#6b3a31" stroke-width="2"/>
    <g clip-path="url(#c${id})"><rect x="0" y="${level}" width="80" height="200" fill="#c8172c"/>
    <rect x="14" y="${level}" width="6" height="200" fill="#e9586a" opacity=".5"/></g>
    <rect x="20" y="40" width="40" height="22" rx="3" fill="#f7ede4" opacity=".9"/>
    <text x="40" y="50" text-anchor="middle" font-size="7" font-family="Figtree,sans-serif" font-weight="800" fill="#7d0d1b">SAG-M</text>
    <text x="40" y="58" text-anchor="middle" font-size="6" font-family="Figtree,sans-serif" fill="#3d201b">${id==="one"?"0 RhD neg":"Pool"}</text>
  </svg>`;
}
function board(){
  const total=S.rounds.length||S.nRounds;
  const r = S.phase==="round" ? `Runde ${S.idx+1} af ${total}` : S.phase==="end" ? "Slut" : `${total} runder`;
  return `<header class="board">
    <div class="side">${bag(S.score.one/Math.max(1,total),"one")}
      <div class="who"><div class="tag">Den ene</div>
      <div class="name" contenteditable="plaintext-only" spellcheck="false" id="nm" title="Klik for at skifte navn">${esc(S.name)}</div></div>
      <div class="pts">${S.score.one}</div></div>
    <div class="mid"><div class="vs">MOD</div><div class="rnd">${r}</div></div>
    <div class="side right"><div class="pts">${S.score.all}</div>
      <div class="who"><div class="tag">Hele afdelingen</div><div class="name">Alle</div></div>
      ${bag(S.score.all/Math.max(1,total),"all")}</div>
  </header>`;
}

/* ---------- Værtens visninger ---------- */
function render(){
  if(IS_PHONE) return;
  const app=$("#app");
  if(S.phase==="start") app.innerHTML=startView();
  else if(S.phase==="edit") app.innerHTML=editView();
  else if(S.phase==="round") app.innerHTML=board()+roundView();
  else if(S.phase==="end") app.innerHTML=board()+endView();
  const nm=$("#nm"); if(nm){ nm.addEventListener("input",()=>{S.name=nm.textContent.trim()||"Den ene"}); nm.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();nm.blur()}}) }
  drawQR();
}

function startView(){
  const {items}=parseBank(loadBank());
  const opts=[5,7,9,11,items.length].filter((v,i,a)=>v<=items.length&&a.indexOf(v)===i);
  return `<main class="hero">
    <div><h1 class="title">Alle<br><em>mod</em> <span class="one">en</span></h1>
      <p class="sub">Høstfest på Hæmatologisk Afdeling, Rigshospitalet. Hele salen stemmer på mobilen, og én kollega skal gætte gennemsnittet.</p></div>
    <form class="setup" id="setup">
      <h2 style="font-size:clamp(26px,2.4vw,44px)">Klar til høst</h2>
      <label for="in-name">Hvem er den ene?<input id="in-name" value="${esc(S.name==="Den ene"?"":S.name)}" placeholder="Fx overlæge Hansen"></label>
      <div class="row2">
        <label for="in-room">Personer i salen<input id="in-room" type="number" min="1" value="${S.room}"></label>
        <label for="in-n">Antal runder<select id="in-n">${opts.map(v=>`<option ${v===S.nRounds?"selected":""} value="${v}">${v===items.length?`Alle ${v}`:v}</option>`).join("")}</select></label>
      </div>
      <div class="row2">
        <label for="in-m">Den ene skal ramme inden for<select id="in-m">${[5,10,15,20].map(v=>`<option value="${v}" ${v===S.margin?"selected":""}>± ${v} % af skalaen</option>`).join("")}</select></label>
        <label for="in-shuf" style="flex-direction:row;align-items:center;text-transform:none;letter-spacing:0;font-size:1em;align-self:end"><input id="in-shuf" type="checkbox" ${S.shuffle?"checked":""}> Bland rækkefølgen</label>
      </div>
      <label for="in-url">Link til afstemning uden login (valgfrit)<input id="in-url" value="${esc(S.extUrl)}" placeholder="Fx dit Mentimeter- eller Slido-link"></label>
      <ul class="rules">
        <li>Spørgsmålet vises, og alle i salen stemmer på mobilen via QR-koden.</li>
        <li>Imens siger den ene sit bud på salens gennemsnit.</li>
        <li>Rammer buddet inden for margenen, får den ene point. Ellers får alle point.</li>
        <li>Ja/nej-spørgsmål: den ene gætter, hvor mange procent der siger ja.</li>
      </ul>
      <div class="small">${esc(NET.status)}</div>
      ${NET.gameId&&!S.extUrl?`<div style="display:flex;gap:14px;align-items:center"><div class="qr" id="qr" style="width:130px;flex:none"></div><div class="small">Salen kan scanne allerede nu og vente på første spørgsmål.<br>${esc(voteUrl())}</div></div>`:""}
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="primary" type="submit">Start spillet</button>
        <button type="button" class="ghost" id="b-edit">Ret spørgsmål (${items.length})</button>
      </div>
      <div class="kbd">Genveje: Mellemrum = næste trin · F = fuld skærm</div>
    </form>
  </main>`;
}

function editView(){
  const t=loadBank(); const {items,errors}=parseBank(t);
  return `<main class="setup" style="flex:1">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <h2 style="font-size:clamp(26px,2.4vw,44px)">Spørgsmålsbanken</h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="ghost" id="b-reset">Gendan eksempler</button>
        <button class="primary" id="b-save">Gem og tilbage</button></div></div>
    <p class="help">Én linje pr. runde. <code>SKALA | spørgsmål | 1 | 10 | tekst ved 1 | tekst ved 10</code> eller <code>JANEJ | spørgsmål</code>. Linjer der starter med # springes over. Ændringer gemmes kun i denne browser.</p>
    <textarea id="bank" spellcheck="false">${esc(t)}</textarea>
    <div class="help" id="bank-status">${items.length} runder fundet. ${errors.map(e=>`<div class="err">${esc(e)}</div>`).join("")}</div>
  </main>`;
}

function pct(r,v){ return Math.max(0,Math.min(100,100*(v-r.min)/(r.max-r.min))) }
function histogram(r){
  const vs=currentVotes(); if(!vs.length) return "";
  if(r.type==="janej"){
    const ja=vs.filter(v=>v.value>=50).length, nej=vs.length-ja, m=Math.max(ja,nej,1);
    return `<div class="small">Ja: ${ja} · Nej: ${nej}</div>`;
  }
  const bins=[]; for(let x=r.min;x<=r.max;x++) bins.push(vs.filter(v=>Math.round(v.value)===x).length);
  const m=Math.max(...bins,1);
  return `<div class="hist" aria-hidden="true">${bins.map(b=>`<i style="height:${100*b/m}%"></i>`).join("")}</div>`;
}
function scaleView(r){
  const rev=S.step==="revealed"&&S.final;
  const ticks=[]; if(r.type==="janej"){ for(let x=0;x<=100;x+=10) ticks.push(x+"%") } else { for(let x=r.min;x<=r.max;x++) ticks.push(x) }
  const tol=tolOf(r);
  return `<div class="scale">
    ${rev?histogram(r):""}
    <div class="track">
      ${rev?`<div class="band" style="left:${pct(r,S.final.avg-tol)}%;right:${100-pct(r,S.final.avg+tol)}%"></div>`:""}
      ${S.guess!=null?`<div class="pin one" style="left:${pct(r,S.guess)}%"><span class="who">${esc(S.name)}</span><span class="val">${fmtVal(r,S.guess)}</span></div>`:""}
      ${rev?`<div class="pin avg" style="left:${pct(r,S.final.avg)}%"><span class="who">Salens gennemsnit</span><span class="val">${fmtVal(r,S.final.avg)}</span></div>`:""}
    </div>
    <div class="ticks">${ticks.map(t=>`<span>${t}</span>`).join("")}</div>
    <div class="ends"><span>${esc(r.lo)}</span><span>${esc(r.hi)}</span></div>
  </div>`;
}

function roundView(){
  const r=S.rounds[S.idx]; const step=S.step;
  const n=currentVotes().length;
  const typeName=r.type==="janej"?"Ja eller nej":`Skala ${r.min} til ${r.max}`;
  const gStep=r.type==="janej"?1:0.1;
  let panel="";
  if(step==="open") panel=`<div class="side-panel"><div class="chip live">Afstemning åben</div>
      <div class="qr" id="qr" aria-label="QR-kode til afstemningen"></div>
      <div class="small">Scan og stem<br>${esc(qrUrl().replace(/^https?:\/\//,""))}</div>
      ${EXT()?`<div class="small">Tast salens gennemsnit fra afstemningen, når alle har stemt.</div></div>`:`<div><div class="count" id="vcount">${n}</div><div class="small">stemmer${S.room?` af ca. ${S.room}`:""}</div></div></div>`}`;
  else if(step==="revealed") panel=`<div class="side-panel"><div><div class="count">${S.final.n}</div><div class="small">${S.final.n?"stemmer talt":"manuelt gennemsnit"}</div></div></div>`;
  else panel=`<div class="side-panel"><div class="small">${esc(EXT()?"Afstemning via jeres eget link":NET.status)}</div></div>`;

  let verdict="";
  if(step==="revealed"){
    const d=Math.abs(S.guess-S.final.avg); const w=S.results[S.idx];
    verdict=`<div class="verdict ${w}">${w==="one"?`${esc(S.name)} rammer plet`:`Alle tager runden`}</div>
      <p class="desc">${esc(S.name)} sagde ${fmtVal(r,S.guess)}. Salen landede på ${fmtVal(r,S.final.avg)}. Forskel: ${r.type==="janej"?Math.round(d)+" procentpoint":dk(d,1)}, og margenen var ± ${r.type==="janej"?Math.round(tolOf(r))+" procentpoint":dk(tolOf(r),1)}.</p>`;
  }

  const guessInput=`<div class="stepper"><span class="kbd">${esc(S.name)}s bud</span>
      <button data-g="-${gStep}" aria-label="Lavere">−</button>
      <input id="guess" type="number" step="${gStep}" min="${r.min}" max="${r.max}" value="${S.guess??""}" placeholder="?">
      <button data-g="${gStep}" aria-label="Højere">+</button>${r.type==="janej"?`<span class="kbd">%</span>`:""}</div>`;
  const manual=`<div class="stepper"><span class="kbd">${EXT()?"Salens gennemsnit fra afstemningen":"Gennemsnit tastet manuelt (valgfrit)"}</span>
      <input id="manual" type="number" step="${gStep}" min="${r.min}" max="${r.max}" value="${S.manualAvg??""}" placeholder="–"></div>`;

  return `<section class="stage" aria-live="polite">
    <div class="main">
      <div class="eyebrow"><span class="chip">${typeName}</span><span class="chip alt">Runde ${S.idx+1}</span></div>
      <div class="q">${esc(r.q)}</div>
      ${scaleView(r)}
      ${verdict}
      ${step!=="revealed"?`<div class="inputs">${guessInput}${manual}</div>`:""}
    </div>
    ${panel}
  </section>
  <footer class="host">
    <div class="grp">
      ${step==="ready"?`<button class="gold" id="b-open" ${canOpen()?"":"disabled"}>Åbn afstemning <span class="kbd">mellemrum</span></button>`:""}
      ${step!=="revealed"?`<button class="primary" id="b-reveal">${step==="open"?"Luk og vis gennemsnit":"Vis gennemsnit"}</button>`:""}
      ${step==="revealed"?`<button class="ghost" id="b-flip">Giv point til ${S.results[S.idx]==="one"?"alle":esc(S.name)} i stedet</button>`:""}
      <span class="small" id="msg"></span>
    </div>
    <div class="grp">
      <button class="primary" id="b-next" ${step==="revealed"?"":"disabled"}>${S.idx+1<S.rounds.length?"Næste runde":"Se vinderen"} →</button>
    </div>
  </footer>`;
}

function endView(){
  const o=S.score.one,a=S.score.all;
  const head = o>a?`${esc(S.name)} slog hele afdelingen`: a>o?`Afdelingen vinder`:`Uafgjort`;
  const line = o>a?`${o} mod ${a}. Høstkurven går til ${esc(S.name)}.`: a>o?`${a} mod ${o}. Alle deler høstkurven.`:`${o} mod ${a}. Tag en omspilsrunde.`;
  return `<section class="stage" style="grid-template-columns:1fr;align-content:center">
    <div class="main"><span class="chip" style="align-self:flex-start">Resultat</span>
    <h2 class="big-win">${head}</h2>
    <p class="desc">${line}</p>
    <div class="recap">${S.rounds.map((r,i)=>`<span class="${S.results[i]||""}">${i+1}. ${esc(r.q.length>38?r.q.slice(0,36)+"…":r.q)}</span>`).join("")}</div></div>
  </section>
  <footer class="host"><div class="grp"><button id="b-back">Tilbage til sidste runde</button></div>
    <div class="grp"><button class="primary" id="b-new">Nyt spil med en ny "en"</button></div></footer>`;
}

let qrDrawn=null;
function drawQR(){
  const el=$("#qr"); if(!el) return;
  try{ if(window.QRCode){ new QRCode(el,{text:qrUrl(),width:512,height:512,colorDark:"#150a0c",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M}) } else el.innerHTML=`<div class="small" style="color:#150a0c">QR-koden kunne ikke indlæses. Brug linket nedenfor.</div>` }catch(e){}
}
function updateLive(){
  const c=$("#vcount"); if(c) c.textContent=currentVotes().length;
}
function flash(t){ const m=$("#msg"); if(m) m.textContent=t }

/* ---------- Handlinger ---------- */
function startGame(){
  const {items}=parseBank(loadBank());
  let pool=items.slice(); if(S.shuffle) pool.sort(()=>Math.random()-.5);
  S.rounds=pool.slice(0,S.nRounds); S.idx=0; S.score={one:0,all:0}; S.results=[];
  resetRound(); S.phase="round"; render();
  writeGame({open:false,roundId:null,q:"",waiting:"Spillet starter om lidt"});
}
function resetRound(){ S.step="ready"; S.roundId=null; S.guess=null; S.manualAvg=null; S.final=null }
function openVote(){
  if(S.step!=="ready"||!canOpen()) return;
  const r=S.rounds[S.idx];
  S.roundId=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  S.step="open"; render(); chime();
  writeGame({open:true,roundId:S.roundId,q:r.q,type:r.type,min:r.min,max:r.max,lo:r.lo,hi:r.hi,round:S.idx+1});
}
function reveal(){
  const r=S.rounds[S.idx];
  if(S.guess==null||isNaN(S.guess)){ flash(`Indtast ${S.name}s bud først.`); $("#guess")?.focus(); return }
  const live=liveAvg(r); const n=currentVotes().length;
  const avg = S.manualAvg!=null && !isNaN(S.manualAvg) ? S.manualAvg : live;
  if(avg==null){ flash(EXT()?"Tast salens gennemsnit fra afstemningen først.":"Ingen stemmer endnu. Vent på stemmer, eller tast gennemsnittet manuelt."); return }
  S.final={avg, n: S.manualAvg!=null?0:n};
  const win = Math.abs(S.guess-avg) <= tolOf(r)+1e-9 ? "one":"all";
  S.results[S.idx]=win; S.score[win]++; S.step="revealed"; render(); chime();
  burst(win==="one"?"#f1b43c":"#c8172c",70);
  writeGame({open:false,roundId:S.roundId,q:r.q,type:r.type,min:r.min,max:r.max,lo:r.lo,hi:r.hi,round:S.idx+1,closed:true});
}
function flip(){ const w=S.results[S.idx]; if(!w) return; const o=w==="one"?"all":"one"; S.score[w]--; S.score[o]++; S.results[S.idx]=o; render() }
function next(){
  if(S.phase!=="round") return;
  if(S.step==="ready"){ if(canOpen()) openVote(); else reveal(); return }
  if(S.step==="open"){ reveal(); return }
  if(S.idx+1<S.rounds.length){ S.idx++; resetRound(); render(); writeGame({open:false,roundId:null,q:"",waiting:`Runde ${S.idx+1} er på vej`}) }
  else { S.phase="end"; render(); celebrate(); writeGame({open:false,roundId:null,q:"",waiting:"Spillet er slut. Tak fordi du stemte!"}) }
}

/* ---------- Lyd (starter først efter et klik) ---------- */
let ac=null;
function audio(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)() }catch(e){} return ac }
function beep(freq,dur){ const a=audio(); if(!a) return; const o=a.createOscillator(),g=a.createGain(); o.type="square"; o.frequency.value=freq; g.gain.setValueAtTime(.08,a.currentTime); g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur); o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+dur) }
function chime(){ [523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*110)) }

/* ---------- Effekter: bloddråber og høstblade ---------- */
const cv=$("#fx"), cx=cv.getContext("2d"); let parts=[], raf=null;
function sizeCv(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio }
addEventListener("resize",sizeCv); sizeCv();
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function burst(color,n){
  if(reduce) return;
  const cols=[color,"#f1b43c","#c8172c","#d9822b","#7fb24a"];
  for(let i=0;i<n;i++) parts.push({x:Math.random()*cv.width,y:-20*devicePixelRatio,vx:(Math.random()-.5)*2,vy:2+Math.random()*4,r:(5+Math.random()*9)*devicePixelRatio,rot:Math.random()*6,vr:(Math.random()-.5)*.1,c:cols[i%cols.length],leaf:Math.random()<.45});
  if(!raf) loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{ p.x+=p.vx*devicePixelRatio; p.y+=p.vy*devicePixelRatio; p.vx+=Math.sin(p.y/60)*.03; p.rot+=p.vr;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillStyle=p.c; cx.beginPath();
    if(p.leaf){ cx.ellipse(0,0,p.r,p.r*.45,0,0,Math.PI*2) } else { cx.moveTo(0,-p.r*1.4); cx.bezierCurveTo(p.r,-p.r*.2,p.r,p.r,0,p.r); cx.bezierCurveTo(-p.r,p.r,-p.r,-p.r*.2,0,-p.r*1.4) }
    cx.fill(); cx.restore() });
  parts=parts.filter(p=>p.y<cv.height+40);
  raf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,cv.width,cv.height),null);
}
function celebrate(){ [0,400,900].forEach(t=>setTimeout(()=>burst("#f1b43c",90),t)); [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25),i*140)) }
function fullscreen(){ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{}) }catch(e){} }

/* ---------- Klik og taster (vært) ---------- */
if(!IS_PHONE){
document.addEventListener("submit",e=>{
  if(e.target.id!=="setup") return; e.preventDefault();
  S.name=$("#in-name").value.trim()||"Den ene"; S.room=Math.max(1,parseInt($("#in-room").value)||1);
  S.nRounds=parseInt($("#in-n").value); S.margin=parseInt($("#in-m").value); S.shuffle=$("#in-shuf").checked; S.extUrl=$("#in-url").value.trim(); audio(); startGame();
});
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const id=b.id;
  if(b.dataset.g){ const r=S.rounds[S.idx]; const v=Math.round(((S.guess??(r.min+r.max)/2)+Number(b.dataset.g))*10)/10; S.guess=Math.max(r.min,Math.min(r.max,v)); render(); return }
  if(id==="b-edit"){ S.phase="edit"; render() }
  else if(id==="b-save"){ const t=$("#bank").value; const {items}=parseBank(t); if(!items.length) return; saveBank(t); S.nRounds=Math.min(S.nRounds,items.length); S.phase="start"; render() }
  else if(id==="b-reset"){ try{localStorage.removeItem(STORE_KEY)}catch(e){} render() }
  else if(id==="b-open") openVote();
  else if(id==="b-reveal") reveal();
  else if(id==="b-flip") flip();
  else if(id==="b-next") next();
  else if(id==="b-back"){ S.phase="round"; render() }
  else if(id==="b-new"){ S.phase="start"; S.name="Den ene"; S.score={one:0,all:0}; render() }
});
document.addEventListener("change",e=>{
  if(e.target.id==="guess"||e.target.id==="manual"){
    const r=S.rounds[S.idx]; const raw=e.target.value.replace(",","."); const v=raw===""?null:Math.max(r.min,Math.min(r.max,Number(raw)));
    if(e.target.id==="guess") S.guess=(v==null||isNaN(v))?null:v; else S.manualAvg=(v==null||isNaN(v))?null:v;
    render();
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="bank"){ const {items,errors}=parseBank(e.target.value); $("#bank-status").innerHTML=`${items.length} runder fundet. `+errors.map(x=>`<div class="err">${esc(x)}</div>`).join("") }
});
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select"||e.target.isContentEditable) return;
  const k=e.key.toLowerCase();
  if(k==="f"){ fullscreen(); return }
  if(S.phase==="round"&&(k===" "||k==="enter")){ e.preventDefault(); next() }
});
}

/* ---------- Mobil: stemmesiden ---------- */
const P={ref:null,uid:null,game:null,mine:{},state:"loading",err:"",writing:Promise.resolve()};
function renderPhone(){
  const app=$("#app"); const g=P.game;
  let body="";
  if(P.state==="nogame") body=`<div class="wait"><b>Linket mangler spilkoden</b>Scan QR-koden på storskærmen igen.</div>`;
  else if(P.state==="loading") body=`<div class="wait"><b>Forbinder</b>Et øjeblik...</div>`;
  else if(P.state==="nodb") body=`<div class="wait"><b>Kan ikke stemme her</b>Telefonen kunne ikke forbinde til afstemningen. Tjek at du har internet, og scan QR-koden på storskærmen igen.</div>`;
  else if(!g||!g.open) body=`<div class="wait"><b>${g&&g.closed?"Afstemningen er lukket":"Vent på næste spørgsmål"}</b>${g&&g.closed?"Kig op på storskærmen for at se gennemsnittet.":esc(g?.waiting||"Spørgsmålet kommer op på storskærmen.")}</div>`;
  else{
    const my=P.mine[g.roundId];
    let ctl="";
    if(g.type==="janej") ctl=`<div class="yn"><button data-v="100" class="${my===100?"on":""}">Ja</button><button data-v="0" class="${my===0?"on":""}">Nej</button></div>`;
    else { const bs=[]; for(let x=g.min;x<=g.max;x++) bs.push(`<button data-v="${x}" class="${my===x?"on":""}">${x}</button>`);
      ctl=`<div class="vgrid">${bs.join("")}</div><div class="ends"><span>${g.min}: ${esc(g.lo)}</span><span>${g.max}: ${esc(g.hi)}</span></div>` }
    body=`<span class="chip" style="align-self:flex-start">Runde ${g.round||""}</span><div class="q">${esc(g.q)}</div>${ctl}
      <div class="small">${my!=null?`Din stemme er afgivet: ${g.type==="janej"?(my?"Ja":"Nej"):my}. Du kan ændre den, indtil værten lukker.`:"Tryk for at stemme."}</div>`;
  }
  app.innerHTML=`<main class="vote"><div class="brand">Alle <em>mod</em> en</div>${body}${P.err?`<div class="err">${esc(P.err)}</div>`:""}</main>`;
}
async function initPhone(){
  renderPhone();
  if(!PHONE_GAME){ P.state="nogame"; renderPhone(); return }
  if(!FB_READY){ P.state="nodb"; renderPhone(); return }
  try{
    P.uid=await fbInit(); P.ref=fs.collection("games").doc(PHONE_GAME); P.state="ready";
    P.ref.onSnapshot(sn=>{ P.game=sn.exists?sn.data():null; renderPhone() },()=>{ P.err="Forbindelsen blev afbrudt. Genindlæs siden."; renderPhone() });
    renderPhone();
  }catch(e){ console.error(e); P.state="nodb"; renderPhone() }
}
if(IS_PHONE){
  document.addEventListener("click",e=>{
    const b=e.target.closest("button[data-v]"); if(!b||!P.game?.open) return;
    const v=Number(b.dataset.v), rid=P.game.roundId;
    P.mine[rid]=v; P.err=""; renderPhone();
    P.writing=P.writing.then(()=>P.ref.collection("votes").doc(P.uid).set({roundId:rid,value:v,at:Date.now()})).catch(()=>{ P.err="Din stemme kunne ikke gemmes. Prøv igen."; delete P.mine[rid]; renderPhone() });
  });
}

/* ---------- Opstart ---------- */
if(IS_PHONE) initPhone(); else { render(); initHostNet(); }
</script>
